services:
  - type: web
    name: babycare-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "2h"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: babycare-db
    region: oregon
    plan: free
    ipAllowList: []
    databaseName: babycare
    user: babycare
