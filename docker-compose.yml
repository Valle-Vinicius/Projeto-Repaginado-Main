version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: babycare-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: babycare
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
    container_name: babycare-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: babycare
      JWT_SECRET: chave_secreta_padrao_desenvolvimento_babycare_2026
      JWT_EXPIRES_IN: 2h
    depends_on:
      - database

volumes:
  db_data:
