version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: babycare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: babycare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-babycare_local_dev_only}
      POSTGRES_DB: babycare
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/database.postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babycare -d babycare"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: babycare-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: babycare
      DB_PASSWORD: ${DB_PASSWORD:-babycare_local_dev_only}
      DB_NAME: babycare
      JWT_SECRET: chave_secreta_padrao_desenvolvimento_babycare_2026
      JWT_EXPIRES_IN: 2h
    depends_on:
      database:
        condition: service_healthy

volumes:
  pg_data:
