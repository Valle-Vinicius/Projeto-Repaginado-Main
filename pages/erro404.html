<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Página não encontrada na Babycare" />
  <title>Página não encontrada | Babycare</title>
  <link rel="stylesheet" href="../styles/erro404.css" />
</head>
<body>
  <main class="error-page">
    <section class="error-content" aria-labelledby="error-title">
      <a class="brand" href="/" aria-label="Voltar para a página inicial da Babycare">
        <img src="../images/babycare-logo.png" alt="Babycare" />
      </a>

      <div class="error-copy">
        <p class="eyebrow">ERRO 404</p>
        <h1 id="error-title">Essa página<br /><span>não foi encontrada.</span></h1>
        <p class="error-description">
          O endereço acessado não existe ou foi movido. Mas fica tranquilo: você pode voltar para um lugar seguro da Babycare.
        </p>
        <p class="error-path" aria-live="polite">Endereço acessado: <strong id="currentPath">/</strong></p>

        <div class="error-actions">
          <button id="backButton" class="button button-primary" type="button">Voltar</button>
          <a class="button button-secondary" href="/">Ir para o início</a>
        </div>
      </div>

      <p class="error-footer">Babycare · Gestão com cuidado e organização</p>
    </section>

    <section class="error-illustration" aria-hidden="true">
      <div class="illustration-glow"></div>
      <div class="illustration-ring ring-one"></div>
      <div class="illustration-ring ring-two"></div>
      <div class="illustration-number">404</div>
      <div class="illustration-card card-top"><span></span><i></i><i></i></div>
      <div class="illustration-card card-bottom"><span></span><i></i><i></i><i></i></div>
      <div class="illustration-dot dot-one"></div>
      <div class="illustration-dot dot-two"></div>
    </section>
  </main>

  <script src="../js/erro404.js"></script>
</body>
</html>
