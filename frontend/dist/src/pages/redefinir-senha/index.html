<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir Senha | Babycare</title>
    <script type="module" crossorigin src="/assets/redefinir-senha-B1O71KxF.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="stylesheet" crossorigin href="/assets/login-DgYS-7o1.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <div class="login-header">
          <img src="/assets/babycare-logo-DL0jcjfV.png" alt="Babycare" class="login-logo" />
          <h1>Redefinir senha</h1>
          <p>Informe sua nova senha abaixo.</p>
        </div>
        <form id="resetForm" class="login-form">
          <input type="hidden" id="token" />
          <label>
            <span>Nova senha</span>
            <input id="novaSenha" type="password" required minlength="6" maxlength="72" autocomplete="new-password" />
          </label>
          <label>
            <span>Confirmar senha</span>
            <input id="confirmarSenha" type="password" required minlength="6" maxlength="72" autocomplete="new-password" />
          </label>
          <button id="resetButton" class="primary-button" type="submit">
            <span class="button-text">REDEFINIR SENHA</span>
          </button>
          <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="access-request">
          <a href="./login.html">Voltar ao login</a>
        </p>
      </section>
    </main>
  </body>
</html>
