<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários | Babycare</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <link rel="stylesheet" href="../../css/usuarios.css" />
  </head>
  <body class="usuarios-page">
    <div id="pageLoader" class="page-loader" aria-live="polite" aria-label="Carregando página">
      <div class="page-loader-content">
        <span class="page-loader-mark" aria-hidden="true"></span>
        <span class="page-loader-label">Carregando usuários...</span>
        <span class="page-loader-bar" aria-hidden="true"></span>
      </div>
    </div>

    <div class="dashboard-shell">
      <aside id="sidebar" class="sidebar" aria-label="Navegação principal"></aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div class="topbar-left">
            <button id="openSidebarButton" class="icon-button menu-button" type="button" aria-label="Abrir menu"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
            <div>
              <p class="breadcrumb">Babycare <span>/</span> <strong>Usuários</strong></p>
              <h1>Usuários</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <label class="topbar-search" for="topbarSearch"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg><input id="topbarSearch" type="search" placeholder="Pesquisar no painel" autocomplete="off" /></label>
            
            <div class="topbar-divider" aria-hidden="true"></div>
            <div class="topbar-user">
              <div class="avatar avatar-small" id="topbarAvatar">U</div>
              <div class="user-copy topbar-user-copy"><strong id="topbarUserName">Usuário Babycare</strong><span id="topbarUserRole">Perfil de acesso</span></div>
            </div>
          </div>
        </header>

        <div class="dashboard-content usuarios-content">
          <section class="toolbar">
            <input
              id="busca"
              type="search"
              placeholder="Pesquisar por nome ou e-mail"
            /><select id="filtroPerfil">
              <option value="">Todos os perfis</option></select
            ><select id="filtroAtivo">
              <option value="">Todos os status</option>
              <option value="true">Ativos</option>
              <option value="false">Inativos</option></select
            ><button id="atualizar" class="secondary-button" type="button">Atualizar</button>
            <button id="usuExportarCsv" type="button" class="export-button">Exportar CSV</button>
            <button id="novoUsuario" class="primary-button" type="button">Novo usuário</button>
          </section>
          <section class="panel">
            <div class="panel-title">
              <div>
                <span class="eyebrow">CONTROLE DE ACESSO</span>
                <h2>Usuários cadastrados</h2>
              </div>
              <span id="contador" class="counter">—</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Usuário</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th>Departamento</th>
                    <th>Status</th>
                    <th>Último acesso</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="tabela">
                  <tr>
                    <td colspan="7" class="empty">Carregando usuários...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <span class="eyebrow">CADASTRO</span>
            <h2 id="tituloModal">Novo usuário</h2>
          </div>
          <button id="fechar" class="close-button" type="button">×</button>
        </div>
        <form id="formulario">
          <input id="usuarioId" type="hidden" /><label
            >Nome completo<input
              id="nome"
              name="nome"
              required
              maxlength="120" /></label
          ><label
            >E-mail<input
              id="email"
              name="email"
              type="email"
              required
              maxlength="255"
          /></label>
          <div class="form-grid">
            <label>Perfil<select id="perfil" required></select></label
            ><label
              >Departamento<select id="departamento">
                <option value="">Sem departamento</option>
              </select></label
            >
          </div>
          <label
            >Senha <small id="senhaAjuda">obrigatória no cadastro</small
            ><input
              id="senha"
              name="senha"
              type="password"
              minlength="6"
              maxlength="72"
              autocomplete="new-password" /></label
          ><label class="check"
            ><input id="ativo" type="checkbox" checked /> Usuário ativo</label
          >
          <p id="erro" class="form-error" hidden></p>
          <div class="modal-actions">
            <button id="cancelar" class="secondary-button" type="button">
              Cancelar</button
            ><button class="primary-button" type="submit">
              Salvar usuário
            </button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="./usuarios.js"></script>
  </body>
</html>
